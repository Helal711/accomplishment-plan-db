
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android_src/AccomplishmentPlanDB/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Accomplishment Plan DB APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Grant Gradle Permission
        working-directory: android_src/AccomplishmentPlanDB
        run: chmod +x gradlew

      - name: Ensure Debug Keystore
        working-directory: android_src/AccomplishmentPlanDB
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        working-directory: android_src/AccomplishmentPlanDB
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Accomplishment-Plan-DB-Debug-APK
          path: android_src/AccomplishmentPlanDB/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
