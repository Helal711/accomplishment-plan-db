name: Build Android WebView APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android_webview/**'
      - '.github/workflows/android-webview-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Accomplishment Plan DB WebView APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Grant Gradle Execute Permission
        working-directory: android_webview
        run: chmod +x gradlew

      - name: Run Unit & Robolectric Tests
        working-directory: android_webview
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build Debug APK
        working-directory: android_webview
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Accomplishment-Plan-DB-WebView-Debug-APK
          path: android_webview/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
